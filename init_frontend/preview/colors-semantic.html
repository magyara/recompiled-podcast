<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="label-mono">semantic tokens · light mode</div>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
  <div class="swatch"><div class="chip" style="background:#faf9fd"></div><div class="name">--bg</div><div>page</div></div>
  <div class="swatch"><div class="chip" style="background:#ffffff;border:1px solid var(--border)"></div><div class="name">--bg-elevated</div><div>card</div></div>
  <div class="swatch"><div class="chip" style="background:#f4f1ff"></div><div class="name">--bg-sunken</div><div>tint</div></div>
  <div class="swatch"><div class="chip" style="background:#0c0a1a"></div><div class="name">--bg-inverse</div><div>dark</div></div>
  <div class="swatch"><div class="chip" style="background:#7c52ff"></div><div class="name">--brand</div><div>action</div></div>
  <div class="swatch"><div class="chip" style="background:#ebe7f3"></div><div class="name">--border</div><div>1px</div></div>
</div>
<div class="label-mono" style="margin-top:6px;">signal</div>
<div style="display:flex;gap:10px;">
  <div class="swatch" style="flex:1"><div class="chip" style="background:#2bb673"></div><div class="name">success</div><div>#2bb673</div></div>
  <div class="swatch" style="flex:1"><div class="chip" style="background:#f0a92f"></div><div class="name">warning</div><div>#f0a92f</div></div>
  <div class="swatch" style="flex:1"><div class="chip" style="background:#e54a5f"></div><div class="name">error</div><div>#e54a5f</div></div>
  <div class="swatch" style="flex:1"><div class="chip" style="background:#7c52ff"></div><div class="name">info</div><div>brand</div></div>
</div>
</div></body></html>
