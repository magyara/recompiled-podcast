<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="label-mono">surfaces · card variants</div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;">
  <div style="background:#fff;border:1px solid #ebe7f3;border-radius:14px;padding:14px;">
    <div style="font-family:'JetBrains Mono';font-size:10px;color:#7c52ff;letter-spacing:.12em;text-transform:uppercase">// base</div>
    <div style="font-family:'Bricolage Grotesque';font-weight:600;font-size:18px;letter-spacing:-.5px;margin-top:6px;color:#14082f">Elevated card</div>
    <div style="font-family:'Manrope';font-size:12px;color:#555173;margin-top:4px">1px border, white surface.</div>
  </div>
  <div style="background:#f4f1ff;border:1px solid #d6c8ff;border-radius:14px;padding:14px;">
    <div style="font-family:'JetBrains Mono';font-size:10px;color:#4f25b8;letter-spacing:.12em;text-transform:uppercase">// tinted</div>
    <div style="font-family:'Bricolage Grotesque';font-weight:600;font-size:18px;letter-spacing:-.5px;margin-top:6px;color:#241055">Soft surface</div>
    <div style="font-family:'Manrope';font-size:12px;color:#4f25b8;margin-top:4px">Violet-50 with brand border.</div>
  </div>
  <div style="background:var(--surface-inverse);border-radius:14px;padding:14px;position:relative;overflow:hidden">
    <div style="position:absolute;inset:0;background:radial-gradient(circle at 80% -20%,var(--surface-inverse-glow),transparent 60%);pointer-events:none"></div>
    <div style="position:relative">
      <div style="font-family:'JetBrains Mono';font-size:10px;color:var(--on-surface-inverse-eyebrow);letter-spacing:.12em;text-transform:uppercase">// inverse</div>
      <div style="font-family:'Bricolage Grotesque';font-weight:600;font-size:18px;letter-spacing:-.5px;margin-top:6px;color:var(--on-surface-inverse)">Bright hero</div>
      <div style="font-family:'Manrope';font-size:12px;color:var(--on-surface-inverse-muted);margin-top:4px">Violet-700 with light glow.</div>
    </div>
  </div>
</div>
</div></body></html>
