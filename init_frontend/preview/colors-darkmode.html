<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="label-mono">semantic tokens · dark mode</div>
<div style="background:#060410;border-radius:14px;padding:18px;display:grid;grid-template-columns:repeat(6,1fr);gap:8px;">
  <div class="swatch" style="color:#a8a2c4"><div class="chip" style="background:#060410;border:1px solid rgba(255,255,255,.16)"></div><div class="name" style="color:#fff">--bg</div><div>page</div></div>
  <div class="swatch" style="color:#a8a2c4"><div class="chip" style="background:#161427;border:1px solid rgba(255,255,255,.08)"></div><div class="name" style="color:#fff">--bg-elevated</div><div>card</div></div>
  <div class="swatch" style="color:#a8a2c4"><div class="chip" style="background:#0c0a1a;border:1px solid rgba(255,255,255,.08)"></div><div class="name" style="color:#fff">--bg-sunken</div><div>well</div></div>
  <div class="swatch" style="color:#a8a2c4"><div class="chip" style="background:#9a78ff"></div><div class="name" style="color:#fff">--brand</div><div>v-400</div></div>
  <div class="swatch" style="color:#a8a2c4"><div class="chip" style="background:#f5f3ff"></div><div class="name" style="color:#fff">--fg</div><div>text</div></div>
  <div class="swatch" style="color:#a8a2c4"><div class="chip" style="background:#a8a2c4"></div><div class="name" style="color:#fff">--fg-muted</div><div>quiet</div></div>
</div>
<div style="font-family:var(--font-body);font-size:12px;color:var(--fg-muted);">Brand shifts up one step (500→400) in dark mode for legibility. Borders become low-alpha white.</div>
</div></body></html>
