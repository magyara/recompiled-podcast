<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="label-mono">buttons</div>
<div class="row">
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:#7c52ff;color:#fff;border:0;padding:11px 20px;border-radius:999px;box-shadow:0 8px 24px -10px rgba(124,82,255,.6);cursor:pointer">Listen on Spotify</button>
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:transparent;color:#14082f;border:1.5px solid #d3cce4;padding:9.5px 20px;border-radius:999px;cursor:pointer">All episodes</button>
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:#ebe4ff;color:#4f25b8;border:0;padding:11px 20px;border-radius:999px;cursor:pointer">Subscribe</button>
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:transparent;color:#7c52ff;border:0;padding:11px 16px;border-radius:8px;cursor:pointer">Read transcript →</button>
</div>
<div class="row">
  <button style="font-family:'Manrope';font-weight:600;font-size:13px;background:#7c52ff;color:#fff;border:0;padding:8px 16px;border-radius:999px;cursor:pointer">Small</button>
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:#6535e6;color:#fff;border:0;padding:11px 20px;border-radius:999px;cursor:pointer">Pressed</button>
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:#b1adc6;color:#fff;border:0;padding:11px 20px;border-radius:999px;cursor:not-allowed;opacity:.7">Disabled</button>
  <button style="font-family:'Manrope';font-weight:600;font-size:14px;background:#14082f;color:#fff;border:0;padding:11px 20px;border-radius:999px;cursor:pointer">Inverse</button>
</div>
<div class="label-mono">primary · secondary · soft · ghost · sizes · states</div>
</div></body></html>
