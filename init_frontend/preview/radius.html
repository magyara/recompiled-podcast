<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card">
<div class="label-mono">corner radius</div>
<div style="display:flex;gap:14px;align-items:flex-end;">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div style="width:72px;height:72px;background:linear-gradient(135deg,#9a78ff,#4f25b8);border-radius:4px;"></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg);">--radius-sm</div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);">4px</div>
</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div style="width:72px;height:72px;background:linear-gradient(135deg,#9a78ff,#4f25b8);border-radius:8px;"></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg);">--radius-md</div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);">8px</div>
</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div style="width:72px;height:72px;background:linear-gradient(135deg,#9a78ff,#4f25b8);border-radius:14px;"></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg);">--radius-lg</div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);">14px</div>
</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div style="width:72px;height:72px;background:linear-gradient(135deg,#9a78ff,#4f25b8);border-radius:22px;"></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg);">--radius-xl</div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);">22px</div>
</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div style="width:72px;height:72px;background:linear-gradient(135deg,#9a78ff,#4f25b8);border-radius:32px;"></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg);">--radius-2xl</div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);">32px</div>
</div><div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
  <div style="width:72px;height:72px;background:linear-gradient(135deg,#9a78ff,#4f25b8);border-radius:999px;"></div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg);">--radius-pill</div>
  <div style="font-family:var(--font-mono);font-size:10px;color:var(--fg-muted);">pill</div>
</div>
</div>
</div></body></html>
