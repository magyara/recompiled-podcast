<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Recompiled — UI kit</title>
<link rel="icon" href="../../assets/logomark.svg" />
<link rel="stylesheet" href="../../colors_and_type.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); }
  /* Mobile nav toggle */
  @media (max-width: 760px) {
    .rc-nav-desktop { display: none !important; }
    .rc-nav-mobile { display: inline-flex !important; }
  }
  /* Hover/press for buttons */
  .rc-btn:hover { filter: brightness(0.96); }
  .rc-btn:active { transform: scale(0.96); }
  a { transition: color 120ms var(--ease-out); }
  /* Padding-bottom for sticky player */
  body { padding-bottom: 110px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="Tokens.jsx"></script>
<script type="text/babel" src="Primitives.jsx"></script>
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="EpisodeList.jsx"></script>
<script type="text/babel" src="Hosts.jsx"></script>
<script type="text/babel" src="Player.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>

<script type="text/babel">
function App() {
  const [active, setActive] = React.useState('home');
  const [nowPlaying, setNowPlaying] = React.useState(null);
  const [isPlaying, setIsPlaying] = React.useState(false);

  React.useEffect(() => {
    if (window.lucide) lucide.createIcons();
  });

  const handlePlay = (ep) => {
    if (nowPlaying?.n === ep.n) {
      setIsPlaying(p => !p);
    } else {
      setNowPlaying(ep);
      setIsPlaying(true);
    }
  };

  return (
    <div>
      <Nav active={active} onNavigate={(id) => {
        setActive(id);
        const el = document.getElementById(id);
        if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
      }} />
      <div id="home" style={{ paddingTop: 8 }}>
        <Hero
          onListen={() => handlePlay(EPISODES[0])}
          onBrowse={() => {
            const el = document.getElementById('episodes');
            if (el) window.scrollTo({ top: el.offsetTop - 80, behavior: 'smooth' });
          }}
        />
      </div>
      <div id="episodes">
        <EpisodeList onPlay={handlePlay} nowPlaying={isPlaying ? nowPlaying : null} />
      </div>
      <Hosts />
      <Subscribe />
      <Footer />
      <Player
        episode={nowPlaying}
        isPlaying={isPlaying}
        onTogglePlay={() => setIsPlaying(p => !p)}
        onClose={() => { setNowPlaying(null); setIsPlaying(false); }}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
